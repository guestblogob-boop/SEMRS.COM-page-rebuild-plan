<!doctype html>
<html><head><meta charset="utf-8">
<style>
html, body { margin: 0; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
.icon { width: 256px; height: 256px; display: grid; place-items: center; background: linear-gradient(135deg, #0b1f3a 0%, #1e3a66 100%); border-radius: 0; }
.icon svg { width: 168px; height: 168px; }
.banner { width: 1544px; height: 500px; position: relative; overflow: hidden; background: linear-gradient(120deg, #0b1f3a 0%, #13305a 55%, #1e3a66 100%); color: #fff; display: flex; align-items: center; gap: 72px; padding: 0 110px; box-sizing: border-box; }
.banner::before { content: ""; position: absolute; right: -120px; top: -160px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(212,167,44,.28), rgba(212,167,44,0) 70%); }
.banner::after { content: ""; position: absolute; left: 40%; bottom: -260px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.07), rgba(255,255,255,0) 70%); }
.tile { flex: 0 0 auto; width: 300px; height: 300px; border-radius: 64px; display: grid; place-items: center; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); position: relative; z-index: 1; }
.tile svg { width: 200px; height: 200px; }
.copy { position: relative; z-index: 1; }
.name { font-size: 104px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
.name b { color: #d4a72c; font-weight: 800; }
.tag { margin-top: 26px; font-size: 42px; font-weight: 500; color: #dbe4f0; max-width: 900px; line-height: 1.25; }
.pill { display: inline-block; margin-top: 30px; padding: 10px 26px; font-size: 28px; font-weight: 700; color: #0b1f3a; background: #d4a72c; border-radius: 40px; }
</style></head><body>
<div id="out"></div>
<script>
var G = {
	'semrs-core': '<svg viewBox="0 0 120 120" fill="none"><circle cx="50" cy="50" r="30" stroke="#fff" stroke-width="11"/><path d="M72 72l26 26" stroke="#fff" stroke-width="13" stroke-linecap="round"/><path d="M54 32L41 54h12l-6 16 16-24H51l6-14z" fill="#d4a72c"/></svg>',
	'semrs-blocks': '<svg viewBox="0 0 120 120"><rect x="14" y="14" width="40" height="40" rx="9" fill="#fff"/><rect x="66" y="14" width="40" height="40" rx="9" fill="#d4a72c"/><rect x="14" y="66" width="40" height="40" rx="9" fill="#fff" opacity=".55"/><rect x="66" y="66" width="40" height="40" rx="9" fill="#fff"/></svg>',
	'semrs-tools': '<svg viewBox="0 0 120 120" fill="none"><path d="M22 92a42 42 0 1 1 76 0" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M60 82L82 46" stroke="#d4a72c" stroke-width="11" stroke-linecap="round"/><circle cx="60" cy="84" r="9" fill="#fff"/></svg>',
	'semrs-pro': '<svg viewBox="0 0 120 120"><path d="M18 88L26 36l22 22 12-28 12 28 22-22 8 52z" fill="#d4a72c"/><rect x="18" y="92" width="84" height="12" rx="6" fill="#fff"/></svg>'
};
var T = {
	'semrs-core': ['SEMRS <b>Core</b>', 'SEO, speed and AdSense-safe ads in one light plugin', 'Free'],
	'semrs-blocks': ['SEMRS <b>Blocks</b>', 'Icons, fancy headings, post grids, pricing and contact forms', 'Free'],
	'semrs-tools': ['SEMRS <b>Tools</b>', 'Free SEO tools your visitors can use on your site', 'Free'],
	'semrs-pro': ['SEMRS <b>Pro</b>', 'Premium blocks, local SEO, redirects and more', 'Pro']
};
var q = new URLSearchParams(location.search), slug = q.get('slug'), kind = q.get('kind');
document.getElementById('out').innerHTML = kind === 'icon'
	? '<div class="icon">' + G[slug] + '</div>'
	: '<div class="banner"><div class="tile">' + G[slug] + '</div><div class="copy"><div class="name">' + T[slug][0] + '</div><div class="tag">' + T[slug][1] + '</div><span class="pill">' + T[slug][2] + '</span></div></div>';
</script>
</body></html>
