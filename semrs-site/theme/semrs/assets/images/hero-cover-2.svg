<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-labelledby="t">
  <title id="t">SEO consultant with growth and ranking icons</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf4e0"/><stop offset="1" stop-color="#f3dfa8"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a66"/><stop offset="1" stop-color="#0b1f3a"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9b48c"/><stop offset="1" stop-color="#d59a70"/></linearGradient>
    <clipPath id="disc"><circle cx="330" cy="290" r="232"/><rect x="98" y="290" width="464" height="270"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1f3a" flood-opacity=".18"/></filter>
  </defs>

  <!-- Backdrop disc and rings -->
  <circle cx="330" cy="290" r="232" fill="url(#bg)"/>
  <circle cx="330" cy="290" r="262" fill="none" stroke="#0b1f3a" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity=".35"/>
  <path d="M120 230 A222 222 0 0 1 300 70" fill="none" stroke="#d4a72c" stroke-width="16" stroke-linecap="round"/>
  <path d="M540 360 A222 222 0 0 1 430 490" fill="none" stroke="#0b1f3a" stroke-width="10" stroke-linecap="round"/>
  <circle cx="300" cy="70" r="9" fill="#0b1f3a"/>

  <!-- Person (bust) -->
  <g clip-path="url(#disc)">
    <!-- Blazer -->
    <path d="M150 560 C160 450 200 405 262 388 L330 420 L398 388 C460 405 500 450 510 560 Z" fill="url(#suit)"/>
    <!-- Shirt and tie -->
    <path d="M286 392 L330 470 L374 392 L352 384 L330 400 L308 384 Z" fill="#ffffff"/>
    <path d="M322 404 L338 404 L344 418 L336 470 L330 482 L324 470 L316 418 Z" fill="#d4a72c"/>
    <path d="M322 404 L338 404 L334 414 L326 414 Z" fill="#b8860b"/>
    <!-- Lapels -->
    <path d="M262 388 L308 384 L330 470 L292 430 L300 418 Z" fill="#16305a"/>
    <path d="M398 388 L352 384 L330 470 L368 430 L360 418 Z" fill="#16305a"/>
    <!-- Pocket square -->
    <path d="M410 452 L440 446 L438 456 L414 462 Z" fill="#d4a72c"/>
    <!-- Neck -->
    <path d="M308 318 L352 318 L354 388 L330 402 L306 388 Z" fill="url(#skin)"/>
    <path d="M308 338 C320 350 340 350 352 338 L352 356 C340 366 320 366 308 356 Z" fill="#c98c62" opacity=".55"/>
    <path d="M304 382 L330 404 L318 420 L294 392 Z" fill="#f4f6fa"/>
    <path d="M356 382 L330 404 L342 420 L366 392 Z" fill="#f4f6fa"/>
    <!-- Head -->
    <ellipse cx="236" cy="262" rx="13" ry="20" fill="#d59a70" transform="translate(30 0)"/>
    <ellipse cx="394" cy="262" rx="13" ry="20" fill="#d59a70"/>
    <path d="M268 240 C268 182 300 160 330 160 C360 160 392 182 392 240 L392 278 C392 318 362 346 330 346 C298 346 268 318 268 278 Z" fill="url(#skin)"/>
    <!-- Hair -->
    <path d="M262 246 C252 182 290 140 334 142 C380 144 404 176 398 236 C392 212 382 196 364 190 C344 204 300 206 280 196 C270 210 266 226 262 246 Z" fill="#2b1d16"/>
    <path d="M300 180 C320 168 352 168 372 182 C352 178 326 180 300 192 Z" fill="#4a3226"/>
    <!-- Face -->
    <path d="M290 234 C298 228 310 228 318 233" fill="none" stroke="#2b1d16" stroke-width="4" stroke-linecap="round"/>
    <path d="M342 233 C350 228 362 228 370 234" fill="none" stroke="#2b1d16" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="304" cy="252" rx="5" ry="6" fill="#2b1d16"/>
    <ellipse cx="356" cy="252" rx="5" ry="6" fill="#2b1d16"/>
    <circle cx="306" cy="250" r="1.6" fill="#fff"/>
    <circle cx="358" cy="250" r="1.6" fill="#fff"/>
    <path d="M330 258 C326 274 324 282 332 286" fill="none" stroke="#c07f55" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M306 302 C318 316 342 316 354 302" fill="#ffffff" stroke="#9c5a3c" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="292" cy="284" rx="11" ry="6" fill="#e58c7a" opacity=".35"/>
    <ellipse cx="368" cy="284" rx="11" ry="6" fill="#e58c7a" opacity=".35"/>
    <!-- Beard shadow -->
    <path d="M276 288 C286 330 312 344 330 344 C348 344 374 330 384 288 C376 318 356 334 330 334 C304 334 284 318 276 288 Z" fill="#2b1d16" opacity=".22"/>
  </g>

  <!-- Floating badges -->
  <g filter="url(#sh)">
    <circle cx="150" cy="330" r="42" fill="#ffffff"/>
  </g>
  <g transform="translate(150 330)" fill="none" stroke="#0b1f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10 -24 L-4 -6 M10 -24 L4 -6"/>
    <circle cx="0" cy="8" r="13" fill="#d4a72c" stroke="#0b1f3a"/>
    <path d="M0 1 L2.5 6 L8 6.5 L4 10 L5 15.5 L0 12.5 L-5 15.5 L-4 10 L-8 6.5 L-2.5 6 Z" fill="#ffffff" stroke="none"/>
  </g>

  <g filter="url(#sh)">
    <rect x="452" y="150" width="122" height="92" rx="16" fill="#ffffff"/>
  </g>
  <g transform="translate(452 150)">
    <rect x="18" y="56" width="14" height="20" rx="3" fill="#c3cede"/>
    <rect x="40" y="44" width="14" height="32" rx="3" fill="#8aa0c0"/>
    <rect x="62" y="32" width="14" height="44" rx="3" fill="#1e3a66"/>
    <rect x="84" y="18" width="14" height="58" rx="3" fill="#d4a72c"/>
    <path d="M18 34 L48 22 L70 26 L100 10" fill="none" stroke="#0f7b4d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 9 L101 9 L100 18" fill="none" stroke="#0f7b4d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#sh)">
    <rect x="466" y="404" width="112" height="60" rx="30" fill="#0b1f3a"/>
  </g>
  <g transform="translate(496 434)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <circle cx="0" cy="0" r="11"/>
    <path d="M8 8 L16 16"/>
  </g>
  <text x="540" y="440" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#d4a72c" text-anchor="middle">#1</text>

  <!-- Sparkles -->
  <path d="M520 92 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#d4a72c"/>
  <path d="M96 450 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#0b1f3a" opacity=".5"/>
</svg>
