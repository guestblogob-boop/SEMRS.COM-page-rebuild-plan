<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:900px;overflow:hidden;font-family:system-ui,sans-serif}
body.light{background:linear-gradient(135deg,#f6f7f9,#e8eef7)}body.navy{background:linear-gradient(135deg,#0b1f3a,#1e3a66)}
.desk{position:absolute;left:40px;top:112px;width:900px;height:675px;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(11,31,58,.28);background:#fff}
.desk img{width:900px;display:block}
.phone{position:absolute;right:44px;top:126px;width:300px;height:649px;border-radius:40px;padding:10px;background:#111;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.phone img{width:300px;height:649px;object-fit:cover;object-position:top;border-radius:30px;display:block}
</style></head><body><div class="desk"><img id="d"></div><div class="phone"><img id="m"></div>
<script>var q=new URLSearchParams(location.search);document.body.className=q.get("bg")||"light";document.getElementById("d").src="showcase/"+q.get("s")+"-desktop.png";document.getElementById("m").src="showcase/"+q.get("s")+"-mobile.png";</script></body></html>
